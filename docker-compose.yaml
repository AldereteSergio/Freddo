services:
  zayka:
    container_name: zayka
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    volumes:
      - data:/home/zayka/data
    environment:
      - SEARXNG_API_URL=http://searxng:8080
      - CHROME_URL=ws://browser:3000
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - browser
      - searxng
    restart: unless-stopped

  browser:
    container_name: zayka-browser
    image: browserless/chrome:latest
    ports:
      - '3001:3000'
    environment:
      - MAX_CONCURRENT_SESSIONS=10
      - CONNECTION_TIMEOUT=60000
    restart: unless-stopped

  searxng:
    container_name: zayka-searxng
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "5656:8080"
    volumes:
      - ./searxng:/etc/searxng:Z
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET}
      - SEARXNG_VALKEY_URL=valkey://valkey:6379/0
    depends_on:
      - valkey

  valkey:
    container_name: zayka-valkey
    image: valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped

volumes:
  data:
    name: 'zayka-data'
